services:
  # ---------------------------------------------------------
  # 1. Backend Web Service (FastAPI)
  # ---------------------------------------------------------
  - type: web
    name: backend
    plan: free
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && (pip install -e ../ml || true)
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false # You will need to enter your MongoDB Atlas URI in the Render Dashboard
      - key: IN_MEMORY_DB
        value: "false"
      - key: ENVIRONMENT
        value: "production"
      - key: SECRET_KEY
        generateValue: true # Render will automatically generate a secure secret
      - key: CORS_ORIGINS
        sync: false # After the frontend deploys, update this with the frontend's URL
      - key: ML_ARTIFACT_DIR
        value: "artifacts"

  # ---------------------------------------------------------
  # 2. Frontend Static Site (React + Vite)
  # ---------------------------------------------------------
  - type: web
    name: smartmoney
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Catch-all rule to route SPA navigation back to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_ORIGIN
        sync: false # After the backend deploys, update this with the backend's URL
